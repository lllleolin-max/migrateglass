[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "migrateglass"
version = "0.1.0"
description = "Bounded SQLite migration and rollback rehearsal on actual isolated data"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "lllleolin-max"}]
dependencies = []

[project.scripts]
migrateglass = "migrateglass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
